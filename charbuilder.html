<div class="ve-flex-col" data-cancer-id="cancer-header">
	<header class="ve-mobile-sm__hidden page__header">
		<div class="container ve-flex-v-baseline">
			<h1 class="page__title ve-no-wrap ve-my-0" id="page__title">Character Builder</h1>
			<p class="page__subtitle ve-no-wrap ve-my-0" id="page__subtitle">Create a player-character sheet skeleton based on the PHB character creation flow.</p>
		</div>
	</header>

		<ul class="nav nav-pills page__nav-inner" id="navbar"></ul>
	</nav>
</div>

<div class="cancer__wrp-sidebar cancer__wrp-sidebar-lhs cancer__wrp-sidebar-lhs--scrolling-page cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__sidebar-inner cancer__sidebar-inner--top cancer__wrp-interactive"><!--5ETOOLS_AD_LEFT_1--></div><div class="cancer__sidebar-inner cancer__sidebar-inner--bottom cancer__wrp-interactive"><!--5ETOOLS_AD_LEFT_2--></div></div>
<div class="cancer__wrp-sidebar cancer__wrp-sidebar-rhs cancer__wrp-sidebar-rhs--scrolling-page cancer__anchor"><div class="cancer__disp-cancer"></div><div class="cancer__sidebar-inner cancer__sidebar-inner--top cancer__wrp-interactive"><!--5ETOOLS_AD_RIGHT_1--></div><div class="cancer__sidebar-inner cancer__sidebar-inner--bottom cancer__wrp-interactive"><!--5ETOOLS_AD_RIGHT_2--></div></div>

<main class="container" data-cancer-id="cancer-wrapper">
	<div class="charbuilder__toolbar no-print">
		<button class="ve-btn ve-btn-default" id="btn-reset-form" type="button">Reset Form</button>
		<span class="charbuilder__toolbar-note">Client-side only. No save/export yet.</span>
	</div>

	<form id="charbuilder-form" class="charbuilder__form">
		<section class="charbuilder__panel">
			<h3 class="charbuilder__panel-title">Character Basics</h3>
			<div class="row">
				<div class="col-md-4 col-sm-6 form-group">
					<label for="char-name">Character Name</label>
					<input class="ve-form-control" id="char-name" type="text" placeholder="e.g. Althaea Stormleaf">
				</div>
				<div class="col-md-4 col-sm-6 form-group">
					<label for="player-name">Player Name</label>
					<input class="ve-form-control" id="player-name" type="text" placeholder="e.g. Jordan">
				</div>
				<div class="col-md-2 col-sm-6 form-group">
					<label for="char-level">Level</label>
					<input class="ve-form-control" id="char-level" type="number" min="1" max="20" value="1">
				</div>
				<div class="col-md-2 col-sm-6 form-group">
					<label for="char-xp">Experience</label>
					<input class="ve-form-control" id="char-xp" type="number" min="0" value="0">
				</div>
			</div>
			<div class="row">
				<div class="col-md-4 col-sm-6 form-group">
					<label for="char-class">Class</label>
					<input class="ve-form-control" id="char-class" type="text" placeholder="e.g. Wizard">
				</div>
				<div class="col-md-4 col-sm-6 form-group">
					<label for="char-species">Species</label>
					<input class="ve-form-control" id="char-species" type="text" placeholder="e.g. Human">
				</div>
				<div class="col-md-4 col-sm-6 form-group">
					<label for="char-background">Background</label>
					<input class="ve-form-control" id="char-background" type="text" placeholder="e.g. Sage">
				</div>
			</div>
		</section>

		<section class="charbuilder__panel">
			<h3 class="charbuilder__panel-title">Ability Scores</h3>
			<div class="row">
				<div class="col-sm-4 col-xs-6 form-group">
					<label for="ability-str">Strength</label>
					<div class="charbuilder__ability-row">
						<input class="ve-form-control" id="ability-str" type="number" min="1" max="30" value="10" data-ability="str">
						<span class="charbuilder__mod" id="mod-str">+0</span>
					</div>
				</div>
				<div class="col-sm-4 col-xs-6 form-group">
					<label for="ability-dex">Dexterity</label>
					<div class="charbuilder__ability-row">
						<input class="ve-form-control" id="ability-dex" type="number" min="1" max="30" value="10" data-ability="dex">
						<span class="charbuilder__mod" id="mod-dex">+0</span>
					</div>
				</div>
				<div class="col-sm-4 col-xs-6 form-group">
					<label for="ability-con">Constitution</label>
					<div class="charbuilder__ability-row">
						<input class="ve-form-control" id="ability-con" type="number" min="1" max="30" value="10" data-ability="con">
						<span class="charbuilder__mod" id="mod-con">+0</span>
					</div>
				</div>
				<div class="col-sm-4 col-xs-6 form-group">
					<label for="ability-int">Intelligence</label>
					<div class="charbuilder__ability-row">
						<input class="ve-form-control" id="ability-int" type="number" min="1" max="30" value="10" data-ability="int">
						<span class="charbuilder__mod" id="mod-int">+0</span>
					</div>
				</div>
				<div class="col-sm-4 col-xs-6 form-group">
					<label for="ability-wis">Wisdom</label>
					<div class="charbuilder__ability-row">
						<input class="ve-form-control" id="ability-wis" type="number" min="1" max="30" value="10" data-ability="wis">
						<span class="charbuilder__mod" id="mod-wis">+0</span>
					</div>
				</div>
				<div class="col-sm-4 col-xs-6 form-group">
					<label for="ability-cha">Charisma</label>
					<div class="charbuilder__ability-row">
						<input class="ve-form-control" id="ability-cha" type="number" min="1" max="30" value="10" data-ability="cha">
						<span class="charbuilder__mod" id="mod-cha">+0</span>
					</div>
				</div>
			</div>
		</section>

		<section class="charbuilder__panel">
			<h3 class="charbuilder__panel-title">Combat and Proficiencies</h3>
			<div class="row">
				<div class="col-md-3 col-sm-6 form-group">
					<label for="armor-class">Armor Class</label>
					<input class="ve-form-control" id="armor-class" type="number" min="0" value="10">
				</div>
				<div class="col-md-3 col-sm-6 form-group">
					<label for="initiative">Initiative</label>
					<input class="ve-form-control" id="initiative" type="number" value="0">
				</div>
				<div class="col-md-3 col-sm-6 form-group">
					<label for="speed">Speed</label>
					<input class="ve-form-control" id="speed" type="text" placeholder="e.g. 30 ft.">
				</div>
				<div class="col-md-3 col-sm-6 form-group">
					<label for="hit-points">Hit Points</label>
					<input class="ve-form-control" id="hit-points" type="number" min="1" value="8">
				</div>
			</div>
			<div class="row">
				<div class="col-sm-6 form-group">
					<label for="proficiencies">Proficiencies</label>
					<textarea class="ve-form-control" id="proficiencies" rows="4" placeholder="Armor, weapons, tools, and saving throw proficiencies"></textarea>
				</div>
				<div class="col-sm-6 form-group">
					<label for="languages">Languages</label>
					<textarea class="ve-form-control" id="languages" rows="4" placeholder="Common, Elvish, etc."></textarea>
				</div>
			</div>
		</section>

		<section class="charbuilder__panel">
			<h3 class="charbuilder__panel-title">Equipment</h3>
			<div id="equipment-rows" class="charbuilder__equipment-rows"></div>
			<div class="charbuilder__equipment-actions">
				<button class="ve-btn ve-btn-default" id="btn-add-equipment" type="button"><span class="glyphicon glyphicon-plus"></span> Add Equipment Row</button>
			</div>
		</section>

		<section class="charbuilder__panel">
			<h3 class="charbuilder__panel-title">Character Details</h3>
			<div class="row">
				<div class="col-md-6 form-group">
					<label for="personality-traits">Personality Traits</label>
					<textarea class="ve-form-control" id="personality-traits" rows="3"></textarea>
				</div>
				<div class="col-md-6 form-group">
					<label for="ideals">Ideals</label>
					<textarea class="ve-form-control" id="ideals" rows="3"></textarea>
				</div>
			</div>
			<div class="row">
				<div class="col-md-6 form-group">
					<label for="bonds">Bonds</label>
					<textarea class="ve-form-control" id="bonds" rows="3"></textarea>
				</div>
				<div class="col-md-6 form-group">
					<label for="flaws">Flaws</label>
					<textarea class="ve-form-control" id="flaws" rows="3"></textarea>
				</div>
			</div>
			<div class="row">
				<div class="col-xs-12 form-group">
					<label for="backstory">Backstory Notes</label>
					<textarea class="ve-form-control" id="backstory" rows="5" placeholder="Add your concept, goals, and connections."></textarea>
				</div>
			</div>
		</section>
	</form>

	<template id="equipment-row-template">
		<div class="charbuilder__equipment-row">
			<div class="row">
				<div class="col-sm-5 form-group">
					<label>Item</label>
					<input class="ve-form-control" type="text" placeholder="e.g. Longsword">
				</div>
				<div class="col-sm-2 col-xs-6 form-group">
					<label>Qty</label>
					<input class="ve-form-control" type="number" min="1" value="1">
				</div>
				<div class="col-sm-2 col-xs-6 form-group">
					<label>Weight</label>
					<input class="ve-form-control" type="text" placeholder="lb">
				</div>
				<div class="col-sm-2 col-xs-6 form-group">
					<label>Cost</label>
					<input class="ve-form-control" type="text" placeholder="gp">
				</div>
				<div class="col-sm-1 col-xs-6 form-group charbuilder__equipment-remove-col">
					<label class="ve-hidden-xs">&nbsp;</label>
					<button class="ve-btn ve-btn-danger ve-btn-sm charbuilder__btn-remove-equipment" type="button" title="Remove row"><span class="glyphicon glyphicon-trash"></span></button>
				</div>
			</div>
		</div>
	</template>
</main>
